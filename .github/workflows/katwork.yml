# KatWork fork checks (see KATWORK.md). Actions are pinned by commit.
name: KatWork

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-marks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash scripts/check-no-marks.sh --self-test
      - run: bash scripts/check-no-marks.sh
